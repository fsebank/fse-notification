server.port=8182

# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Format SQL nicely
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Connection Pool (HikariCP - default)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml


# ===============================
# Security
# ===============================
# Default admin is seeded on startup whenever no admin with this username exists.
# If no password is supplied, a random one is generated and printed once in the startup log.
#app.security.default-admin.username=${FSE_DEFAULT_ADMIN_USERNAME:admin}
#app.security.default-admin.password=${FSE_DEFAULT_ADMIN_PASSWORD:}
#app.security.default-admin.full-name=Default Administrator
# Admin access tokens. Secret is base64 of at least 32 random bytes (e.g. `openssl rand -base64 32`).
# If unset, a random key is used per startup and tokens are invalidated on restart.
app.security.jwt.secret=${FSE_JWT_SECRET:}
app.security.jwt.expiry=30m
# Admin login throttling (in memory, per instance). Failures within the lockout window lock the username / IP.
app.security.login.max-failures-per-username=5
app.security.login.max-failures-per-ip=20
app.security.login.lockout=15m
# ===============================
# SMS provider - Africa's Talking
# ===============================
# Use username "sandbox" with a sandbox API key for testing. Supply real values via env vars, never commit them.
africastalking.username=${AFRICASTALKING_USERNAME:}
africastalking.api-key=${AFRICASTALKING_API_KEY:}
# Default sender ID when a request has none; must be registered with Africa's Talking for live traffic.

# Uncomment when running behind a trusted reverse proxy/load balancer so IP whitelisting sees the real client IP.
#server.forward-headers-strategy=native

# Enable console logging
logging.level.root=INFO

#Messaging settings

#Mail-trap settings

africastalking.sender-name=${SMS_SENDER_NAME:FSE Bank}
app.notification.sms.provider=${SMS_PROVIDER:AFRICASTALKINGSMS}
app.notification.email.provider=${EMAIL_PROVIDER:MAILTRAP}
app.notification.email.enabled=${EMAIL_ENABLED:true}
app.notification.email.from=${EMAIL_FROM:}
app.notification.email.smtp.host=${SMTP_HOST:}
app.notification.email.smtp.port=${SMTP_PORT:587}
app.notification.email.smtp.username=${SMTP_USERNAME:}
app.notification.email.smtp.password=${SMTP_PASSWORD:}
app.notification.email.smtp.auth=${SMTP_AUTH:true}
app.notification.email.smtp.starttls=${SMTP_STARTTLS_ENABLE:true}

#Mail-trap settings
app.notification.email.mailtrap.host=${MAILTRAP_HOST:}
app.notification.email.mailtrap.port=${MAILTRAP_PORT:}
app.notification.email.mailtrap.username=${MAILTRAP_USERNAME:}
app.notification.email.mailtrap.password=${MAILTRAP_PASSWORD:}
app.notification.email.mailtrap.from=${MAILTRAP_FROM:}
app.notification.email.mailtrap.starttls=${MAILTRAP_STARTTLS_ENABLE:true}
