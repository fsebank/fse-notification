databaseChangeLog:
  - changeSet:
      id: 003-admin-user-password-tracking
      author: Tommy Sunday Henry
      changes:
        - addColumn:
            tableName: admin_user
            columns:
              - column:
                  name: password_changed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Access tokens issued before this instant are rejected
              - column:
                  name: must_change_password
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: When true the admin may only call the change-password endpoint
                  constraints:
                    nullable: false
