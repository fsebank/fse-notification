name: Deploy Notification Core

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: deploy-notification
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon -x test

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: sudo /usr/local/bin/deploy-notification.sh